[package]
name = "rustcode"
version = "0.2.0"
edition = "2021"

[dependencies]
eframe = "0.29"
# Подсветка: чистый Rust (fancy-regex), без C-зависимостей
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Настоящий терминал: PTY + эмулятор VT100
portable-pty = "0.8"
vt100 = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
