[package]
name = "rustcode"
version = "0.3.0"
edition = "2021"

[dependencies]
open = "5"
eframe = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
image = { version = "0.25", features = ["png"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
vt100 = "0.18"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4